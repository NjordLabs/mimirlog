repo: NjordLabs/mimirlog

milestones:
  - name: Phase 1 — Foundation
    epics:
      - id: LOG-001
        status: open
        title: Ship structured logging
        overview:
          problem: >-
            Callers were about to configure the standard library logger
            differently in every service.
          goal: >-
            One JSON formatter, a redaction filter, correlation ids, and
            call decorators that do not record arguments.
        decision: >-
          In the context of a Python service library, facing ad-hoc
          logging setup, we decided to keep logging in its own package,
          to achieve one redaction and correlation path, accepting a
          dependency on the pattern library for named loggers.
        acceptance_criteria:
          - Records are JSON and secret mapping keys are redacted
          - A correlation id is bound for the current context only
          - Call decorators log the outcome and not the arguments
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: LOG-001-T1
            status: done
            title: Implement the logger and the quality caller
            instructions:
              files:
                - src/mimirlog/log.py
                - src/mimirlog/format.py
                - src/mimirlog/redact.py
                - .github/workflows/ci-quality.yml
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
          - id: LOG-001-T2
            status: open
            title: Publish to PyPI with a trusted publisher
            instructions:
              files:
                - .github/workflows/publish-pypi.yml
            verification:
              - Pending publisher for NjordLabs/mimirlog, workflow .github/workflows/publish-pypi.yml, environment pypi
            guardrail_refs:
              - PY-TEST-002
          - id: LOG-001-T3
            status: done
            title: Run the test job on Python 3.14
            instructions:
              files:
                - .github/workflows/ci-quality.yml
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
          - id: LOG-001-T4
            status: done
            title: Add a repo-level container CI script
            instructions:
              files:
                - scripts/check-ci-docker.sh
            verification:
              - sh scripts/check-ci-docker.sh
            guardrail_refs:
              - PY-TEST-002
      - id: REDACT-001
        status: open
        title: Redact secrets that the filter currently skips
        overview:
          problem: >-
            A secret passed as a logging extra, a mapping that is not a
            dict, or a cyclic payload is written in the clear or raises.
          goal: >-
            Secret-named extras and nested mappings, tuples, and cycles
            are redacted, and a returned coroutine is logged when it finishes.
        decision: >-
          In the context of structured logs, facing values the filter
          did not walk, we decided to redact by key name at a bounded
          depth, to achieve logs that do not contain those secrets,
          accepting that free text is still not scanned.
        acceptance_criteria:
          - extra password is replaced with ***
          - Tuples, mappings, and cycles are walked without RecursionError
          - A function that returns a coroutine is logged after it finishes
        guardrail_refs:
          - APP-LOG-001
        tasks:
          - id: REDACT-001-T1
            status: open
            title: Walk the values the filter skipped
            instructions:
              files:
                - src/mimirlog/redact.py
                - src/mimirlog/format.py
                - src/mimirlog/decorators.py
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - APP-LOG-001
      - id: PIN-001
        status: done
        title: Pin guardrails 1.17.1 and hash the container install
        overview:
          problem: >-
            The repository still cited guardrails 1.15.0, and the container
            install did not pin dependency hashes.
          goal: >-
            Pins match the current org tags, dev tools live in a dependency
            group, and the container install requires hashes.
        decision: >-
          In the context of the org quality bar, facing a stale pin, we
          decided to move to guardrails 1.17.1 and hash the container
          install, to achieve the current gates, accepting a lock refresh.
        acceptance_criteria:
          - docs/guardrails is 1.17.1 and .github/scaffold is 1.14.3
          - Dev tools are a dependency group
          - The container install uses --require-hashes
        guardrail_refs:
          - SC-DEP-008
          - PY-RUN-002
          - PY-SEC-004
        tasks:
          - id: PIN-001-T1
            status: done
            title: Bump the pins and the local parity scripts
            instructions:
              files:
                - .github/workflows/ci-quality.yml
                - scripts/check-ci-local.sh
                - scripts/check-ci-docker.sh
            verification:
              - sh scripts/check-ci-local.sh
              - sh scripts/check-ci-docker.sh
            guardrail_refs:
              - SC-DEP-008
